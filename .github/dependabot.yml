version: 2
updates:
  # ONE npm entry, at the root (register 5.736). This is a pnpm workspace with a
  # single pnpm-lock.yaml; the root entry already updates every workspace
  # package.json together with that lockfile. A per-folder entry
  # ('/apps/web', '/packages/*') cannot update the root lockfile, so every PR it
  # opened failed `pnpm install --frozen-lockfile` before any check ran.
  # Guard: apps/web/src/lib/__tests__/dependabotConfig.test.ts
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        dependency-type: 'development'
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']
      - dependency-name: 'next'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-intl'
        update-types: ['version-update:semver-major']
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      - dependency-name: 'knip'
        update-types: ['version-update:semver-major']

  # GitHub Actions, pinned to commit SHAs (register 5.868): Dependabot bumps the SHA and its
  # `# vN` comment together, so pins stay current without hand edits.
  # Guard: apps/web/src/lib/__tests__/workflowPins.test.ts
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    # The same 3-day wait the npm side gets from pnpm's minimumReleaseAge.
    cooldown:
      default-days: 3
