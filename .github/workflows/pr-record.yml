name: PR record
# PR-RECORD (register 5.727): every pull request body carries the increment-review record
# (docs/tech/increment-review-gate.md § Return block). Re-runs when the body is edited.
# Each run reads the body from the API WHEN IT RUNS, not from its triggering event, and no run
# is ever cancelled (register 5.818): a push and a body edit in the same second started two
# runs, the concurrency rule cancelled one, and the cancelled run of this REQUIRED check
# blocked the merge (#840). GitHub counts EVERY run of a required check on the commit, not
# only the newest (5.835): a run that failed before the body was fixed stays red until it is
# re-run, and a re-run reads the current body, so re-running the red run is the remedy.
# The body never passes through the shell: `gh` writes it to a file the script reads, so a
# crafted body cannot run commands. Rehearse locally with
# `node scripts/check-pr-record.mjs --file <body.md>`.
on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Read the current PR body
        run: gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.body // ""' > "$RUNNER_TEMP/pr-body.md"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
      - run: node scripts/check-pr-record.mjs --file "$RUNNER_TEMP/pr-body.md"
        env:
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_REPO: ${{ github.repository }}
