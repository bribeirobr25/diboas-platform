name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # 5.468: depth 2 so the /market staleness step can diff HEAD^1..HEAD
          # (a PR's merge commit against its base, or a push against its parent).
          fetch-depth: 2
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          # Phase 4.2 (audit/2026-05-08): bumped from 20 → 24 ahead of the
          # 2026-06-02 deprecation deadline for the older runner-bundled
          # Node. Vercel's runtime has already moved to Node 24 LTS.
          node-version: 24
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Formatting gate (2026-06-07): `prettier --check .` covers all tracked
      # source + docs (markdown included; .prettierignore excludes build output).
      # Placed first as the cheapest fail-fast check. Fix locally with `pnpm format`.
      - run: pnpm format:check
      - run: pnpm type-check
      - run: pnpm lint
      # GATE-INDEX-CI-1 (founder-approved 2026-10-21): the gate registry's own
      # check. Fails on a gate row missing from the status index, an index entry
      # with no row, a status outside LIVE/PARTIAL/PLANNED, wrong totals, or a
      # row that states a delivery state (GATE-STATE-1). Reads tracked files only.
      - run: pnpm review:authorities
      # DOC-1 layer 1: a reference presented as authority in CLAUDE.md, README.md or
      # docs/tech resolves or says it cannot. Its verdict reads tracked files only and is
      # the same in every clone; run nowhere before, it sat red on main for nine days
      # (2026-10-21 → 10-30, register 5.704 audit).
      - run: pnpm review:doc1
      - run: pnpm test
      # 5.468 (founder-ruled 2026-09-29): the /market 14-day staleness backstop
      # BLOCKS only a change that touches market data or code; every other
      # lane gets a visible ::warning:: and passes. Before this, a stale /market
      # turned EVERY lane's CI red (it would have tripped 2026-09-29 13:20 UTC).
      # `pnpm test` above runs the same rule warn-only; this step is where the
      # scope decision is made. Fail-closed: if the changed-file list cannot be
      # computed, the backstop enforces.
      - name: /market staleness backstop (blocks market changes only)
        env:
          MARKET_PATHS: '^(apps/web/data/market/|apps/web/scripts/market-refresh/|apps/web/scripts/data-fetchers/|apps/web/src/lib/(market-data|analytics-sdk|market)/|apps/web/src/app/\[locale\]/\(landing\)/market/|apps/web/src/components/(Analytics|Market)/|\.github/workflows/market-refresh)'
        run: |
          set -uo pipefail
          if changed=$(git diff --name-only HEAD^1 HEAD); then
            if printf '%s\n' "$changed" | grep -Eq "$MARKET_PATHS"; then enforce=1; else enforce=0; fi
          else
            echo "::warning::could not compute the changed files — enforcing the /market backstop"
            enforce=1
          fi
          echo "market change: $([ "$enforce" = 1 ] && echo yes || echo no)"
          MARKET_STALENESS_ENFORCE=$enforce node apps/web/scripts/market-refresh/lib/staleness.mjs
      # 2026-10-21 (founder decision, TVL freshness proposal): the /protocols TVL
      # figures and the historical anchors are checked here, not by wall-clock
      # unit tests that turned every lane red on a date. Same rule as above:
      # BLOCK a commit that touches the data, WARN everywhere else; fail-closed.
      # The scheduled data-freshness.yml run is the owner's alert.
      - name: Reference-data freshness (blocks changes to that data only)
        run: node apps/web/scripts/data-freshness/check.mjs --changed-from-git
      # C-3: static gates that previously ran only locally (via validate:all).
      # The Phase-7 jargon ban + the "no direct market-data constant imports"
      # SDK invariant — both server-free. (Not `validate:market-data`, whose
      # fixtures.test.ts is already covered by `pnpm test` above.)
      - run: node scripts/check-market-data-jargon.mjs
      - run: pnpm validate:sdk-invariant
      - run: pnpm validate:translations
      - run: pnpm validate:design-tokens
      # UX governance drift guard (2026-07-12): makes the governance layer a
      # REAL merge gate, not just a local check. `validate:ux-canon` was in
      # `validate:all` but never mirrored here when the other static gates were
      # pulled out (C-3), so it had never actually run in CI — the whole canon /
      # checklist / VOICE_RUBRIC drift guard was inert. CI-safe: it existsSync-
      # guards the untracked areas (docs/full-view/, docs/audit/) and passes on
      # the tracked-only tree (verified via `git archive HEAD`). `check:ux-greps`
      # is the machine-tell gate (emoji hard-fail; em-dash/hardcoded-English are
      # advisory, non-failing) — also previously manual-only.
      - run: pnpm validate:seo
      - run: pnpm validate:ux-canon
      - run: pnpm check:ux-greps
      - name: Build (one retry for the 5.88 font-fetch flake)
        # 5.88 (2026-08-13, founder-approved after 3 same-day recurrences of the
        # Google-Fonts build-time fetch flake — next/font/google refetches from
        # fonts.gstatic.com on every cold runner; "Error while requesting
        # resource" x9): one retry absorbs the transient fetch failure. Turbo
        # cache makes the retry cheap (packages already built). The durable
        # next/font/local option stays registered on 5.88 if flakes persist.
        run: pnpm build || pnpm build
      # Phase 5.2 (audit/2026-05-09): Turbopack-aware bundle-budget gate.
      # Replaces the original webpack-plugin enforcement (was inert under
      # Turbopack — see F1 audit). Walks `.next/static/chunks` for size /
      # count regressions. Fails CI if peak asset, total, or count exceed
      # baseline + headroom recorded in scripts/check-bundle-budget.mjs.
      - run: pnpm check:budget
      # Phase 3B (audit/2026-05-18): build-storybook gate. Storybook stories
      # are EXCLUDED from `tsc --noEmit` per `apps/web/tsconfig.json:40-41`
      # (L13 audit lock), so story-file TypeScript errors are only caught by
      # `build-storybook`. Run after build:budget so we don't double-pay for
      # an early failure when the production build itself broke.
      - run: pnpm --filter web build-storybook
