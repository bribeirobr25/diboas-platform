# Quarterly security scan (PENDING_ALL 5.24 — supply-chain sprint 2026-07-11).
#
# Runs scripts/security-scan.sh --live against production on the first Monday
# of Jan/Apr/Jul/Oct (06:00 UTC) + on manual dispatch after any major
# dependency or infrastructure change. Read-only: passive recon + local
# dependency/secrets checks; no state changes.
#
# Output lands as a run artifact; findings are triaged manually into the
# security findings ledger (docs/audit/SECURITY_FINDINGS_<DATE>.md — local-
# only per the docs retention policy). The scan failing marks the run red so
# the cadence can't silently rot.

name: Security Scan (quarterly)

on:
  schedule:
    # First week of each quarter, Monday-ish anchor: Jan/Apr/Jul/Oct day 1-7.
    # GitHub cron has no "first Monday" — run on day 1. The output artifact is kept
    # 90 days (the repository maximum; a longer request is cut to 90), so it does NOT
    # reach the next quarter: triage it into the findings ledger within those 90 days
    # (5.898).
    - cron: '0 6 1 1,4,7,10 *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Run security scan (live, read-only)
        # shell: bash runs with pipefail: GitHub's default `bash -e` takes the exit code of `tee`,
        # so a failing scan left the run green (fifteenth audit; guard: workflowPipefail.test.ts).
        shell: bash
        run: bash scripts/security-scan.sh --live | tee security-scan-output.txt

      # Snyk full-project test (F24 lesson, 2026-07-17): pnpm audit reads the
      # npm/GHSA DB only — advisories with a Snyk-only ID and no CVE (e.g.
      # SNYK-JS-ESBUILD-17750822) never appear in it. This step closes that
      # blind spot on the quarterly cadence. Requires the SNYK_TOKEN repo
      # secret (app.snyk.io → Account settings → API token); skips cleanly
      # when unset so the workflow stays green on forks/before setup.
      # Fails the run only on NEW critical findings; accepted findings live
      # in SECURITY_FINDINGS_2026-05.md (F23/F24 dispositions).
      - name: Snyk full-project test (no-CVE advisory coverage)
        if: always()
        # pipefail, as above: the snyk exit code, not tee's, decides the step.
        shell: bash
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [ -z "$SNYK_TOKEN" ]; then
            echo "::warning title=Snyk skipped::SNYK_TOKEN secret not configured — no-CVE advisory coverage relies on app.snyk.io PR checks only."
            exit 0
          fi
          # Pinned, not @latest: an unpinned package runs with SNYK_TOKEN (5.898).
          npx --yes snyk@1.1308.3 test --all-projects --severity-threshold=critical | tee -a security-scan-output.txt

      - name: Upload scan output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-scan-${{ github.run_id }}
          path: security-scan-output.txt
          retention-days: 90
