name: Security Audit
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 1' # Weekly scans

jobs:
  secrets:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so gitleaks can diff PR commits against base.
          # Configured via .gitleaks.toml at repo root.
          fetch-depth: 0
      - name: Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required so the action can post a summary comment on PRs.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Hard-fail the job if any unallowlisted secret is found.
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_ENABLE_SUMMARY: true

  audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          # Phase 4.2 (audit/2026-05-08): bumped from 20 → 24 — see ci.yml.
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Security Audit
        id: audit
        run: |
          # Fail only on CRITICAL vulnerabilities.
          #
          # Known findings with no runtime exposure (dev/build-time transitive only,
          # tracked in docs/audit/SECURITY_FINDINGS_2026-05.md § F21/F23/F24):
          #   - uuid (moderate) — via @lhci/cli (dev-only)
          #   - elliptic (low) — via @storybook node-polyfill (dev-only, no fix exists)
          #
          # Defanged via pnpm.overrides at root (update SECURITY_FINDINGS when lifted):
          #   - fast-uri <=3.1.1 — overridden to >=3.1.2 (F21, 2026-06-01)
          #   - postcss@8.4.31 (next-internal pin, CVE-2026-41305) — overridden to 8.5.16
          #     (F24, 2026-07-17; remove when next >=16.3.x bumps its own pin)
          #
          # KNOWN BLIND SPOT (F24): pnpm audit reads the npm/GHSA DB only — advisories
          # with a Snyk-only ID and no CVE (e.g. SNYK-JS-ESBUILD-17750822) are invisible
          # here. Coverage for those = Snyk PR checks + the quarterly workflow's snyk step.
          #
          # Baseline 2026-07-17: prod audit CLEAN; full audit 1 moderate / 1 low (dev-only).
          #
          # 2026-07-16: npm RETIRED the audit endpoints pnpm 10.33 calls
          # (HTTP 410 on both /audits/quick and /audits; ERR_PNPM_AUDIT_BAD_RESPONSE),
          # which reddened every PR with an infrastructure error, not a finding.
          # Distinguish the two: the endpoint outage is a warning (dependency
          # scanning remains covered by the Snyk PR checks + the quarterly
          # security-scan workflow); anything else that fails the audit still
          # fails the job. Remove the ERR_PNPM_AUDIT_BAD_RESPONSE branch when
          # pnpm ships the bulk-advisory-endpoint fix.
          set +e
          OUTPUT=$(pnpm audit --prod --audit-level=critical 2>&1)
          CODE=$?
          set -e
          echo "$OUTPUT"
          if [ $CODE -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE"; then
              echo "::warning title=npm audit endpoint retired::pnpm audit hit the retired npm endpoint (HTTP 410). Treated as infrastructure outage, not a vulnerability finding. Coverage continues via Snyk PR checks + the quarterly scan."
            else
              echo "failed=true" >> $GITHUB_OUTPUT
            fi
          fi
        continue-on-error: true

      - name: Notify Slack on Failure
        if: steps.audit.outputs.failed == 'true'
        uses: slackapi/slack-github-action@v3
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_ALERT }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Security vulnerabilities detected in diBoaS Platform",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Security Audit Failed*\n*Event:* ${{ github.event_name }}\n*Branch:* ${{ github.ref_name }}\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }

      - name: Fail if vulnerabilities found
        if: steps.audit.outputs.failed == 'true'
        run: exit 1
