name: ledger-char-base

# ⛑ LEDGER-CHAR-1 · the base differential (plan P12 D11; register 5.1008).
#
# The Practice ledger's commands are moving into pure decisions (S1a), behaviour unchanged.
# Committed goldens could be re-recorded to make a failing PR pass, so this job trusts none of
# them: it records the output of the PR's BASE (main's tip) and of the PR's MERGE COMMIT (the
# base plus exactly this PR's change, which `actions/checkout` checks out on pull_request) with
# the same judge, and compares them case by case: every case the base recorded must exist with
# the same bytes; new cases are allowed and listed.
#
# The judge (the harness and its test runners, the update setup, teardown, config and compare
# script, the frozen PR-1 hashes, the base vitest config, the test setup, the package scripts and
# this file) may not change in a PR this job judges. Limit, stated: GitHub runs the PR's own copy
# of this file, so a PR that edits it also edits the check; the judge list makes that edit fail
# here, and review is the backstop.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ledger-char-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Decide whether there is anything to compare, and refuse a changed judge
        id: base
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          C=apps/sandbox/src/lib/ledger/decide/__tests__/characterization
          if ! git cat-file -e "$BASE_SHA:apps/sandbox/scripts/characterization/updateSetup.ts" 2>/dev/null; then
            echo "The characterization harness is not on the base yet: nothing to compare."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$(git diff --name-only "$BASE_SHA" HEAD -- apps/sandbox packages pnpm-lock.yaml)" ]; then
            echo "This PR changes nothing the Practice ledger is built from: nothing to compare."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          JUDGE=(
            "$C"/harness.ts "$C"/recorder.ts "$C"/compare.ts "$C"/mocks.ts "$C"/seed.ts
            "$C"/frozen.json "$C"/*.test.ts
            apps/sandbox/scripts/characterization
            apps/sandbox/vitest.char-update.config.mts
            apps/sandbox/vitest.config.mts
            apps/sandbox/src/test/setup.ts
            apps/sandbox/package.json
            .github/workflows/ledger-char-base.yml
          )
          CHANGED=$(git diff --name-only "$BASE_SHA" HEAD -- "${JUDGE[@]}")
          if [ -n "$CHANGED" ]; then
            echo "::error::This PR changes the characterization judge, which a judged PR may not:"
            echo "$CHANGED"
            exit 1
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Record the base's output
        if: steps.base.outputs.skip == 'false'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git worktree add "$RUNNER_TEMP/base-tree" "$BASE_SHA"
          cd "$RUNNER_TEMP/base-tree"
          pnpm install --frozen-lockfile
          pnpm --filter 'sandbox^...' build
          CHAR_OUT="$RUNNER_TEMP/out-base" pnpm --filter sandbox char:update
      - name: Record the PR's output with the same judge
        if: steps.base.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter 'sandbox^...' build
          CHAR_OUT="$RUNNER_TEMP/out-head" pnpm --filter sandbox char:update
      - name: Compare case by case
        if: steps.base.outputs.skip == 'false'
        shell: bash
        run: |
          node "$RUNNER_TEMP/base-tree/apps/sandbox/scripts/characterization/compareOutputs.mjs" \
            "$RUNNER_TEMP/out-base" "$RUNNER_TEMP/out-head"
