name: ledger-char-base

# ⛑ LEDGER-CHAR-1 · the base differential (plan P12 D11 as amended by P12a; register 5.1008, 5.1029).
#
# The Practice ledger's behaviour must not change by ACCIDENT. Committed goldens could be re-recorded
# to make a failing PR pass, so this job trusts none of them: it records the PR's BASE (main's tip,
# the merge commit's first parent) and the PR's MERGE COMMIT with the SAME JUDGE — the base's — and
# compares them case by case: every case the base recorded must exist with the same bytes, and the
# PR's recording may hold no other case.
#
# The judge (the whole characterization folder, its scripts, the recording config and the test
# setup) is RESTORED FROM THE BASE into the PR's tree before the PR is recorded and verified before
# and after recording, so editing judge files cannot change how a PR is judged: such a PR is recorded
# with the old judge, and its change takes effect for the PRs after it (P12a J1, J2). Nothing is
# refused: Dependabot and config PRs are recorded and compared like any other. Three jobs share only
# artifacts, so the PR's code never touches the base's output or the comparator (P12a J3). It also
# runs on every push to main, which catches PRs that each passed alone but change behaviour together.
#
# Limits, stated (P12a §3): this detects ACCIDENTAL behaviour changes, not a PR written to defeat it —
# the PR's ledger code runs inside the recorder's process, and its install and build scripts run on
# the same runner before the judge is restored, so code built to do it can forge its own recording;
# code review is the control for that. GitHub runs the PR's own copy of THIS file. The PR's
# dependencies are under test by design, except the judge's runtime (vitest, vite, happy-dom,
# @vitejs/plugin-react), which plan D14 freezes until S1a PR-3 and which this job names in a notice;
# `@diboas/test-support`, `apps/sandbox/tsconfig.json`, `.npmrc`, `pnpm-workspace.yaml`, `patches/`
# and the root `package.json` and `turbo.json` still reach the PR's recording, so a change to them
# is printed as a notice and must be named in the PR record.

on:
  pull_request:
    branches: [main]
    # No `edited`: a run for a title or description edit would report "nothing to compare" as a
    # passing check on the same commit and hide an earlier failed comparison. A stacked PR retargeted
    # onto main is compared on its next push, and the push run on main catches anything merged
    # without one.
  push:
    branches: [main]

permissions:
  contents: read

env:
  # One list, used by every step that restores or verifies the judge (P12a J1; charBaseJudge.test.ts).
  JUDGE: >-
    apps/sandbox/src/lib/ledger/decide/__tests__/characterization
    apps/sandbox/scripts/characterization
    apps/sandbox/vitest.char-update.config.mts
    apps/sandbox/src/test/setup.ts
    apps/sandbox/src/test/networkGuard.ts
  NOTICE_PATHS: >-
    apps/sandbox/tsconfig.json
    .npmrc
    pnpm-workspace.yaml
    patches
    package.json
    turbo.json
    packages/test-support

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      base: ${{ steps.plan.outputs.base }}
      skip: ${{ steps.plan.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Decide whether there is anything to compare; name judge and build-setting changes
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          # A PR's merge commit, or a merge on main: its first parent IS the base it was built on.
          BASE_SHA=$(git rev-parse HEAD^1)
          echo "Base: $BASE_SHA · head: $(git rev-parse HEAD) · event: $EVENT${ACTION:+ ($ACTION)}"
          echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
          if ! git cat-file -e "$BASE_SHA:apps/sandbox/scripts/characterization/updateSetup.ts" 2>/dev/null; then
            echo "The characterization harness is not on the base yet: nothing to compare."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$(git diff --name-only "$BASE_SHA" HEAD -- apps/sandbox packages pnpm-lock.yaml $NOTICE_PATHS)" ]; then
            echo "This PR changes nothing the Practice ledger is built from: nothing to compare."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # shellcheck disable=SC2086
          JUDGED=$(git diff --name-only "$BASE_SHA" HEAD -- $JUDGE)
          if [ -n "$JUDGED" ]; then
            echo "::notice::This PR changes the characterization judge. It is recorded with the base's judge; the change takes effect for the PRs after it merges (plan P12a J2). The PR record must say so:"
            echo "$JUDGED"
          fi
          # shellcheck disable=SC2086
          SETTINGS=$(git diff --name-only "$BASE_SHA" HEAD -- $NOTICE_PATHS)
          if [ -n "$SETTINGS" ]; then
            echo "::notice::This PR changes build settings that reach its recording (plan P12a §3). The PR record must name them:"
            echo "$SETTINGS"
          fi
          RUNTIME=$(git diff "$BASE_SHA" HEAD -- pnpm-lock.yaml | grep -E '^[+-] +(/?)(vitest|vite|happy-dom|@vitejs/plugin-react)@' || true)
          if [ -n "$RUNTIME" ]; then
            echo "::notice::This PR moves the judge's runtime, which plan D14 freezes until S1a PR-3; the PR record must say why:"
            echo "$RUNTIME"
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

  record-base:
    needs: plan
    if: needs.plan.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.base }}
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install and build the base
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter 'sandbox^...' build
      - name: Record the base
        shell: bash
        working-directory: apps/sandbox
        env:
          NODE_OPTIONS: ''
        run: CHAR_OUT="$RUNNER_TEMP/out" node node_modules/vitest/vitest.mjs run --config vitest.char-update.config.mts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: char-out-base
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 7

  record-head:
    needs: plan
    if: needs.plan.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: 'pnpm'
      - name: Install and build the PR
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter 'sandbox^...' build
      - name: Restore the judge from the base, and prove it is the base's
        shell: bash
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          git restore --source="$BASE_SHA" --staged --worktree -- $JUDGE
          echo "Restored from the base (what the PR had differently):"
          # shellcheck disable=SC2086
          git diff --name-status HEAD -- $JUDGE
          # shellcheck disable=SC2086
          git diff --exit-code "$BASE_SHA" -- $JUDGE
          # shellcheck disable=SC2086
          UNTRACKED=$(git ls-files --others -- $JUDGE)
          if [ -n "$UNTRACKED" ]; then echo "::error::untracked files beside the restored judge (ignored ones included):"; echo "$UNTRACKED"; exit 1; fi
      - name: Record the PR with the base's judge
        shell: bash
        working-directory: apps/sandbox
        env:
          NODE_OPTIONS: ''
        run: CHAR_OUT="$RUNNER_TEMP/out" node node_modules/vitest/vitest.mjs run --config vitest.char-update.config.mts
      - name: Prove the judge was not changed while recording
        shell: bash
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          git diff --exit-code "$BASE_SHA" -- $JUDGE
          # shellcheck disable=SC2086
          UNTRACKED=$(git ls-files --others -- $JUDGE)
          if [ -n "$UNTRACKED" ]; then echo "::error::untracked files beside the restored judge (ignored ones included):"; echo "$UNTRACKED"; exit 1; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: char-out-head
          path: ${{ runner.temp }}/out
          if-no-files-found: error
          retention-days: 7

  ledger-char-base:
    needs: [plan, record-base, record-head]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Nothing to compare, or a recording failed
        id: gate
        shell: bash
        env:
          SKIP: ${{ needs.plan.outputs.skip }}
          PLAN: ${{ needs.plan.result }}
          BASE: ${{ needs.record-base.result }}
          HEAD: ${{ needs.record-head.result }}
        run: |
          set -euo pipefail
          if [ "$PLAN" != "success" ]; then echo "::error::the plan job did not succeed ($PLAN)"; exit 1; fi
          if [ "$SKIP" = "true" ]; then echo "Nothing to compare."; echo "compare=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$BASE" != "success" ] || [ "$HEAD" != "success" ]; then
            echo "::error::a recording did not succeed (base: $BASE, PR: $HEAD)"; exit 1
          fi
          echo "compare=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.compare == 'true'
        with:
          persist-credentials: false
          ref: ${{ needs.plan.outputs.base }}
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /apps/sandbox/scripts/characterization/
            /apps/sandbox/src/lib/ledger/decide/__tests__/characterization/frozen.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.compare == 'true'
        with:
          name: char-out-base
          path: ${{ runner.temp }}/out-base
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.gate.outputs.compare == 'true'
        with:
          name: char-out-head
          path: ${{ runner.temp }}/out-head
      - name: Compare case by case, with the base's comparator and frozen ids
        if: steps.gate.outputs.compare == 'true'
        shell: bash
        run: |
          node apps/sandbox/scripts/characterization/compareOutputs.mjs \
            "$RUNNER_TEMP/out-base" "$RUNNER_TEMP/out-head" \
            apps/sandbox/src/lib/ledger/decide/__tests__/characterization/frozen.json
