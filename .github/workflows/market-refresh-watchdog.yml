# Market Refresh watchdog (PENDING_ALL 5.151, 2026-08-31).
#
# WHY THIS EXISTS: on 2026-08-31 the weekly refresh did not run at its
# scheduled time. The workflow was `active` and the cron intact, yet nothing
# happened at 06:00; the run eventually started at 13:19 UTC — 7h19m late —
# and nobody would have known either way. GitHub delays, and sometimes drops,
# scheduled runs under load. Unwatched, /market ages to its 14-day staleness
# gate with no signal at all.
#
# This job is the missing alarm and nothing else: it asserts that a Market
# Refresh run STARTED recently. It never touches data, never opens a PR, and
# has read-only permissions. It fails CLOSED (principle 7 / robustness R-14:
# background jobs fail loudly, not silently) — a failure sends the standard
# workflow-failure notification.
#
# It deliberately checks "a run started", not "a run succeeded": a refresh that
# runs and legitimately fails a data gate is the fail-closed pipeline working,
# and that already notifies. The blind spot this covers is the run that never
# happened.
#
# Known limits, stated rather than implied:
#   * A manual `workflow_dispatch` also satisfies it — correct by intent, since
#     the question is "did a refresh run", not "did the cron fire".
#   * This watchdog is itself a scheduled workflow, so GitHub could drop IT too.
#     It narrows the blind spot; it does not eliminate it. A belt-and-braces
#     external monitor would, and is deliberately not built for one weekly job.

name: Market Refresh Watchdog

on:
  schedule:
    # Mondays 22:00 UTC — deliberately LATE in the day, not shortly after the
    # 06:17 window. The first version sat at 09:23 on the assumption that a
    # delayed run arrives 1-2h late (07:06-07:52 historically). That assumption
    # was wrong: the 2026-08-31 schedule fired at 13:19 UTC, 7h19m late. A
    # 09:23 check would have alarmed while the run was still coming — a false
    # alarm, which is worse than a late one because it teaches people to ignore
    # the alarm. At 22:00 a 06:17 run is 15h43m old and a 13:19 run 8h41m old
    # (both inside MAX_AGE_HOURS), while a genuinely missed Monday is ~7 days
    # old and still alarms the same day. PENDING_ALL 5.151.
    - cron: '0 22 * * 1'
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

jobs:
  assert-refresh-ran:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Assert a Market Refresh run started in the last 24h
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_HOURS: '24'
        run: |
          set -euo pipefail

          latest=$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow market-refresh-weekly.yml \
            --limit 1 --json createdAt --jq '.[0].createdAt // empty')

          if [ -z "$latest" ]; then
            echo "::error::No Market Refresh run has EVER been recorded. The weekly pipeline is not running."
            exit 1
          fi

          latest_epoch=$(date -u -d "$latest" +%s)
          now_epoch=$(date -u +%s)
          age_hours=$(( (now_epoch - latest_epoch) / 3600 ))

          echo "Most recent Market Refresh run started: $latest (${age_hours}h ago)"

          if [ "$age_hours" -gt "$MAX_AGE_HOURS" ]; then
            echo "::error::Market Refresh has not run for ${age_hours}h (limit ${MAX_AGE_HOURS}h)."
            echo "::error::GitHub most likely DROPPED the scheduled run (PENDING_ALL 5.151)."
            echo "::error::Remedy: dispatch it manually —"
            echo "::error::  gh workflow run market-refresh-weekly.yml --ref main"
            echo "::error::/market data ages toward its 14-day staleness gate until a refresh merges."
            exit 1
          fi

          echo "OK — the weekly refresh fired within the last ${MAX_AGE_HOURS}h."
