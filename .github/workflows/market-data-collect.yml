# Market data collection (founder decisions 2026-11-04).
#
# Fetches every Market series (apps/web/scripts/market-data/catalogue.mjs),
# checks each against an independent source, and stores the daily values,
# distributions, raw responses and check reports in the PRIVATE repository
# bribeirobr25/diboas-analytics under `market/` only. Weekly and monthly
# series are derived from the stored days.
#
# Writes: diboas-analytics only, through MARKET_DATA_TOKEN (scoped to that one
# repository, tested 2026-11-04). This repository is read, never written.
# Data commits go straight to the analytics `main` (approved: under `market/`
# only, append-only); any path outside `market/` aborts the commit.
#
# Raw evidence is committed even when a series is BLOCKED or the collector
# fails or times out, so the failure can be read later; the job then fails so
# the block is visible. Nothing is written to a blocked series' values. Before
# committing, commit-guard.mjs refuses anything that is not an append-only
# change under `market/` (the analytics repo has no branch protection).
#
# The store was seeded by diboas-analytics #1 (merged 2026-11-05, before this
# workflow reached main). Writing to the analytics main is still refused while
# `market/checks/accepted-exceptions.json` is absent there, because a run on an
# empty store would re-backfill without the reviewed exceptions. Triggers: the
# Saturday schedule and manual dispatch only (the temporary push trigger of the
# first backfill was removed 2026-11-05).

name: Market data collection

on:
  schedule:
    # Saturdays 09:23 UTC. Exchange closes (US, B3, Xetra, Coinbase/Coin
    # Metrics UTC days) are final by then. The Fed's H.10 FX rates and broad
    # dollar index are published on MONDAYS and the 10-year yield one business
    # day late, so those series lag by up to a week; the 45-day overlap of
    # every run picks the late days up.
    - cron: '23 9 * * 6'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Fetch every series from its start date (first run)'
        type: boolean
        default: false
      series:
        description: 'Comma-separated series ids (blank = all)'
        type: string
        default: ''
      target_branch:
        description: 'diboas-analytics branch to write to (main, or data/...)'
        type: string
        default: 'main'
  # The Tuesday top-up (plan MP-3b, TOPUP-1; decisions B-2 and answer 13): the weekly refresh
  # calls this workflow before it reads the store, to collect the series published on Monday
  # and re-run any series Saturday blocked. Same steps, guard and concurrency group as Saturday.
  workflow_call:
    inputs:
      topup:
        description: 'Collect the late and blocked series only (the weekly refresh calls this)'
        type: boolean
        default: false
    secrets:
      MARKET_DATA_TOKEN:
        required: true
    outputs:
      status:
        description: 'complete | blocked | failed (empty: the job did not reach its report)'
        value: ${{ jobs.collect.outputs.status }}
      series:
        description: 'The series the top-up tried to collect'
        value: ${{ jobs.collect.outputs.series }}
      blocked:
        description: 'The series still blocked after the top-up'
        value: ${{ jobs.collect.outputs.blocked }}
      behind:
        description: 'Weekday series still a week behind after the top-up (answer 13)'
        value: ${{ jobs.collect.outputs.behind }}

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Job-level, so a call from the weekly refresh (the top-up) and Saturday's schedule share
    # it: the store is never written by two collections at once.
    concurrency:
      group: market-data-collect
      cancel-in-progress: false
    # The top-up is fail-open (decision B-2): its failure shows on this job but never marks the
    # weekly run failed, so the Wednesday retry still judges the cycle by the refresh itself.
    # A scheduled or manual collection is not affected (`inputs.topup` is unset there).
    continue-on-error: ${{ inputs.topup == true }}
    outputs:
      status: ${{ steps.report.outputs.status }}
      series: ${{ steps.report.outputs.series }}
      blocked: ${{ steps.report.outputs.blocked }}
      behind: ${{ steps.report.outputs.behind }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Decide the target
        id: target
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IN_BRANCH: ${{ inputs.target_branch }}
          IN_BACKFILL: ${{ inputs.backfill }}
          IN_SERIES: ${{ inputs.series }}
          IN_TOPUP: ${{ inputs.topup }}
        run: |
          set -euo pipefail
          if [ "${IN_TOPUP:-false}" = "true" ]; then
            # the top-up writes the store's main; the caller runs it only on its schedule from
            # main, and the check below still refuses a call from any other branch
            branch='main'; backfill=false; series=''
          elif [ "$EVENT" = "schedule" ]; then
            branch='main'; backfill=false; series=''
          else
            branch="${IN_BRANCH:-main}"; backfill="${IN_BACKFILL:-false}"; series="${IN_SERIES:-}"
          fi
          # Validate every value before it reaches GITHUB_OUTPUT: a newline in
          # an input would otherwise write a second `branch=` line.
          [[ "$branch" =~ ^(main|data/[A-Za-z0-9._-]+(/[A-Za-z0-9._-]+)*)$ ]] || { echo "refusing target branch"; exit 1; }
          # Only reviewed code writes the store's main: a manual run from any other
          # branch may write a data/ review branch, never main (review of #820).
          [[ "$branch" != "main" || "$REF" == "refs/heads/main" ]] || { echo "refusing: only a run from main writes the analytics main"; exit 1; }
          [[ "$backfill" =~ ^(true|false)$ ]] || { echo "refusing backfill value"; exit 1; }
          [[ -z "$series" || "$series" =~ ^[a-z0-9_]+(,[a-z0-9_]+)*$ ]] || { echo "refusing series value"; exit 1; }
          {
            echo "branch=$branch"
            echo "backfill=$backfill"
            echo "series=$series"
            echo "topup=${IN_TOPUP:-false}"
          } >> "$GITHUB_OUTPUT"
          echo "target: diboas-analytics@$branch backfill=$backfill series=${series:-all} topup=${IN_TOPUP:-false}"

      - name: Check out diboas-analytics
        id: analytics
        env:
          TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          # Header authentication for EVERY git call in this step, git's on-demand blob fetches
          # included: the token is never in a URL or in the clone's .git/config (plan MP-3b).
          source apps/web/scripts/market-data/git-auth.sh
          git clone --quiet --filter=blob:none "https://github.com/bribeirobr25/diboas-analytics.git" analytics
          cd analytics
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git checkout --quiet "$BRANCH"
          else
            git checkout --quiet -b "$BRANCH"
          fi
          if [ "$BRANCH" = "main" ] && [ ! -f market/checks/accepted-exceptions.json ]; then
            echo "refusing: the analytics main has no market store yet (merge diboas-analytics #1 first)"
            exit 1
          fi
          mkdir -p market/checks

      - name: Plan the top-up (the late and the blocked series)
        id: plan
        if: steps.target.outputs.topup == 'true'
        run: |
          set -euo pipefail
          series="$(node apps/web/scripts/market-data/topup-series.mjs --store analytics/market)"
          [[ "$series" =~ ^[a-z0-9_]+(,[a-z0-9_]+)*$ ]] || { echo "refusing top-up series list"; exit 1; }
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "top-up: $series"

      - name: Collect
        id: collect
        timeout-minutes: 40
        env:
          BACKFILL: ${{ steps.target.outputs.backfill }}
          SERIES: ${{ steps.plan.outputs.series || steps.target.outputs.series }}
        run: |
          # GitHub runs `bash -e -o pipefail`: without `set +e` a blocked
          # series (exit 1) would end this step before the evidence is
          # committed (found on the first backfill, run 41931047845).
          set +e -u -o pipefail
          args=(--store analytics/market)
          [ "$BACKFILL" = "true" ] && args+=(--backfill)
          [ -n "$SERIES" ] && args+=(--series "$SERIES")
          node apps/web/scripts/market-data/collect.mjs "${args[@]}" | tee collect.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          # 0 stored, 1 blocked, 3 the run failed: evidence is committed in all
          # three. 2 is bad arguments: nothing was fetched.
          [ "$code" -ne 2 ] || exit 2
          exit 0

      # Runs even when Collect failed or hit its time limit, so the evidence
      # written up to that point is kept.
      - name: Commit under market/ only
        id: commit
        if: always() && steps.analytics.outcome == 'success'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}
          MODE: ${{ steps.target.outputs.topup == 'true' && 'top-up' || github.event_name }}
        run: |
          set -euo pipefail
          # every git call below, the commit guard's and the rebase's blob fetches included
          source apps/web/scripts/market-data/git-auth.sh
          # The bot's identity for EVERY commit this step makes: the commit below and the rebase
          # after a rejected push, which rewrites the commit and needs a committer. GitHub's runners
          # have no default identity, so a rebase without these failed ("Committer identity
          # unknown"): the rejected-push path never worked (found by the R-7 test on CI, MP-3b).
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          cd analytics
          # -f: the analytics .gitignore ignores names such as logs/ and *.log
          git add -A -f market
          node ../apps/web/scripts/market-data/commit-guard.mjs
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit --quiet -m "data(market): collection $(date -u +%F) (${MODE})" \
            -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          # The branch can move while a run collects (a merged PR): rebase the
          # data commit, which only adds under market/, and try again.
          for attempt in 1 2 3; do
            if git push --quiet origin "HEAD:${BRANCH}"; then
              echo "pushed $(git rev-parse --short HEAD) to diboas-analytics@${BRANCH}"
              exit 0
            fi
            echo "push rejected (attempt $attempt); rebasing onto the moved branch"
            git fetch --quiet origin "$BRANCH"
            git rebase --quiet "origin/${BRANCH}"
            node ../apps/web/scripts/market-data/commit-guard.mjs --range "origin/${BRANCH}..HEAD"
          done
          echo "push failed three times"; exit 1

      # The top-up's report to the weekly refresh, which names it in the PR (decision B-2).
      # Values are validated before they reach GITHUB_OUTPUT.
      - name: Report the top-up to the weekly refresh
        id: report
        if: always() && steps.target.outputs.topup == 'true'
        env:
          CODE: ${{ steps.collect.outputs.code }}
          OUTCOME: ${{ steps.collect.outcome }}
          COMMIT: ${{ steps.commit.outcome }}
          SERIES: ${{ steps.plan.outputs.series }}
        run: |
          set -uo pipefail
          blocked=''
          behind=''
          if [ "${CODE:-}" = "1" ] && [ -d analytics/market/checks ]; then
            blocked="$(node apps/web/scripts/market-data/topup-series.mjs --store analytics/market --blocked || true)"
          fi
          if [ -d analytics/market/daily ]; then
            behind="$(node apps/web/scripts/market-data/topup-series.mjs --store analytics/market --behind || true)"
          fi
          if [ "$OUTCOME" = "success" ] && [ "${CODE:-}" = "0" ] && [ "$COMMIT" = "success" ]; then status=complete
          elif [ "$OUTCOME" = "success" ] && [ "${CODE:-}" = "1" ] && [ "$COMMIT" = "success" ]; then status=blocked
          else status=failed; fi
          ids='^([a-z0-9_]+(,[a-z0-9_]+)*)?$'
          [[ "$SERIES" =~ $ids ]] || SERIES=''
          [[ "$blocked" =~ $ids ]] || blocked=''
          [[ "$behind" =~ $ids ]] || behind=''
          { echo "status=$status"; echo "series=$SERIES"; echo "blocked=$blocked"; echo "behind=$behind"; } >> "$GITHUB_OUTPUT"
          echo "top-up: $status; tried ${SERIES:-none}; still blocked: ${blocked:-none}; a week behind: ${behind:-none}"
          if [ "$status" != "complete" ] || [ -n "$behind" ]; then
            echo "::warning::Store top-up: $status; still blocked: ${blocked:-none}; a week behind: ${behind:-none}. The weekly refresh carries on (fail-open)."
          fi

      - name: Fail unless every series was stored
        if: always()
        env:
          CODE: ${{ steps.collect.outputs.code }}
          OUTCOME: ${{ steps.collect.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ] && [ "$CODE" = "0" ]; then exit 0; fi
          grep -E 'BLOCKED|RUN FAILED' collect.log 2>/dev/null || true
          echo "Collect outcome: ${OUTCOME}, exit code: ${CODE:-none}. Evidence is committed; blocked series kept their values."
          exit 1

      # The clone held a writer's work for this run only: delete it, whatever happened.
      - name: Delete the store clone
        if: always()
        run: rm -rf analytics
