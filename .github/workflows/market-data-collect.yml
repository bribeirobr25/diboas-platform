# Market data collection (founder decisions 2026-11-04).
#
# Fetches every Market series (apps/web/scripts/market-data/catalogue.mjs),
# checks each against an independent source, and stores the daily values,
# distributions, raw responses and check reports in the PRIVATE repository
# bribeirobr25/diboas-analytics under `market/` only. Weekly and monthly
# series are derived from the stored days.
#
# Writes: diboas-analytics only, through MARKET_DATA_TOKEN (scoped to that one
# repository, tested 2026-11-04). This repository is read, never written.
# Data commits go straight to the analytics `main` (approved: under `market/`
# only, append-only); any path outside `market/` aborts the commit.
#
# Raw evidence is committed even when a series is BLOCKED (a check outlier or a
# changed stored day), so the failure can be read later; the job then fails
# so the block is visible. Nothing is written to a blocked series' values.

name: Market data collection

on:
  schedule:
    # Saturdays 09:23 UTC: Friday's closes are final everywhere (US, B3,
    # Xetra, FX, FRED's Friday rates are out by then).
    - cron: '23 9 * * 6'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Fetch every series from its start date (first run)'
        type: boolean
        default: false
      series:
        description: 'Comma-separated series ids (blank = all)'
        type: string
        default: ''
      target_branch:
        description: 'diboas-analytics branch to write to'
        type: string
        default: 'main'
  # TEMPORARY (remove before merge): the first backfill runs from this
  # branch, into an analytics REVIEW branch, never into its main.
  push:
    branches: ['feat/market-data-store']
    paths:
      - '.github/workflows/market-data-collect.yml'
      - 'apps/web/scripts/market-data/**'

permissions:
  contents: read

concurrency:
  group: market-data-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Decide the target
        id: target
        env:
          EVENT: ${{ github.event_name }}
          IN_BRANCH: ${{ inputs.target_branch }}
          IN_BACKFILL: ${{ inputs.backfill }}
          IN_SERIES: ${{ inputs.series }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "push" ]; then
            branch='data/market-backfill-review'; backfill=true; series=''
          elif [ "$EVENT" = "schedule" ]; then
            branch='main'; backfill=false; series=''
          else
            branch="${IN_BRANCH:-main}"; backfill="${IN_BACKFILL:-false}"; series="${IN_SERIES:-}"
          fi
          case "$branch" in main|data/*) ;; *) echo "refusing target branch $branch"; exit 1;; esac
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "backfill=$backfill" >> "$GITHUB_OUTPUT"
          echo "series=$series" >> "$GITHUB_OUTPUT"
          echo "target: diboas-analytics@$branch backfill=$backfill series=${series:-all}"

      - name: Check out diboas-analytics
        env:
          TOKEN: ${{ secrets.MARKET_DATA_TOKEN }}
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          git clone --quiet --filter=blob:none "https://x-access-token:${TOKEN}@github.com/bribeirobr25/diboas-analytics.git" analytics
          cd analytics
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git checkout --quiet "$BRANCH"
          else
            git checkout --quiet -b "$BRANCH"
          fi
          mkdir -p market/checks

      - name: Collect
        id: collect
        env:
          BACKFILL: ${{ steps.target.outputs.backfill }}
          SERIES: ${{ steps.target.outputs.series }}
        run: |
          set -uo pipefail
          args=(--store analytics/market)
          [ "$BACKFILL" = "true" ] && args+=(--backfill)
          [ -n "$SERIES" ] && args+=(--series "$SERIES")
          node apps/web/scripts/market-data/collect.mjs "${args[@]}" | tee collect.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" -le 1 ] || exit "$code"

      - name: Commit under market/ only
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          set -euo pipefail
          cd analytics
          git add -A market
          outside=$(git status --porcelain | awk '{print $2}' | grep -v '^market/' || true)
          if [ -n "$outside" ]; then echo "refusing: changes outside market/:"; echo "$outside"; exit 1; fi
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git -c user.name='diboas-market-data' -c user.email='market-data@users.noreply.github.com' \
            commit --quiet -m "data(market): collection $(date -u +%F) (${GITHUB_EVENT_NAME})" \
            -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git push --quiet origin "HEAD:${BRANCH}"
          echo "pushed $(git rev-parse --short HEAD) to diboas-analytics@${BRANCH}"

      - name: Fail when a series was blocked
        if: steps.collect.outputs.code == '1'
        run: |
          grep 'BLOCKED' collect.log || true
          echo "At least one series was blocked; its evidence is stored, its values are not."
          exit 1
