# Weekly /market refresh — automated PR (P3, founder ruling 2026-07-11: Mondays 06:00 UTC).
#
# The pipeline NEVER pushes to main. It opens a PR with the compute log in the
# body; CODEOWNERS reviews the editorial copy and merges. The 14-day staleness
# gate remains the backstop of last resort. Merge stays human until trust is
# earned (plan §B Stage 4).
#
# Flow: fetch (dual-source verified) → quality gate (fail-closed) → engine →
# computed.json → generate editorial JSONs from templates → reconcile → PR.
#
# GATE CLASSES (2026-08-31, PENDING_ALL 5.151 — do not re-merge these two):
#   * BOT-WRITTEN output (generate.mjs --check, jargon, market/analytics-sdk
#     tests, prettier) gates BEFORE the PR. The bot can always satisfy these by
#     regenerating, so blocking is correct and keeps bad data out of a PR.
#   * HUMAN-OWNED fields (the research-memo voice: summary.{short,detailed},
#     key_supportive_factors, key_headwinds — generate.mjs never writes them)
#     are REPORTED here and gate on the PR's own CI instead. A bot pre-flight
#     can never satisfy a human-owned invariant: on 2026-08-31 the memo gate
#     sat in the pre-flight, so a drifted figure killed the job and NO PR was
#     opened — which also broke the ratified AUTO-HOLD policy (it assumes a PR
#     exists to hold) and made the miss invisible except a failure email.
#     The honesty guarantee is unchanged: a stale memo still cannot MERGE,
#     because memoFigureReconciliation runs in the PR's full CI battery.
#
# Requires repo secret POLYGON_API_KEY (founder-owned) for the ETF-01 leg.
# Without it the ETF snapshot step is skipped and ETF-01 stays UNAVAILABLE —
# the run still succeeds (fail-open on the optional leg, fail-closed on core),
# and says so in an annotation and the PR body (P4, 2026-10-28).
#
# AN OPEN REFRESH PR IS CARRIED, NOT REFUSED (C1a, 5.632, 2026-10-28). The run
# starts from `main` with the open PR's data paths laid on top
# (scripts/market-refresh/carry-open-pr.mjs), so the PR it publishes holds both
# weeks and the founder's memo edits. It refuses, naming why, only when carrying
# would lose or misstate something; a refusal is acted on after the ETF leg, so
# that week's collection is kept as the run artifact. SUPERSEDED: "refuse to run
# while a refresh PR is open" (5.464, 2026-09-29).

name: Market Refresh (weekly)

on:
  schedule:
    # 5.151 moved this to :17 past on the premise that GitHub drops runs at
    # popular cron minutes. The record says otherwise (5.183): no run of this
    # workflow has been dropped, and every one starts hours late (measured
    # +1h06m to +7h19m through 2026-09-07; 12:19-15:24 UTC since). The Tuesday
    # attempt and the watchdog (market-refresh-watchdog.yml) cover a late,
    # failed or missing Monday.
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
    # C1d (2026-10-21): the second attempt. It refreshes only when this week
    # has no successful run yet (a dropped or failed Monday); see `decide`.
    - cron: '17 6 * * 2' # Tuesdays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

# 5.465 (2026-09-29): one refresh at a time. A manual dispatch overlapping the
# cron would otherwise race on the same PR branch and the append-only ledgers.
# Queue, never cancel: a cancelled run mid-publish is worse than a late one.
concurrency:
  group: market-refresh
  cancel-in-progress: false

jobs:
  # C1d: Monday and manual runs always refresh; the Tuesday run refreshes only
  # when this week has no successful run (scripts/market-refresh/retry-decision.mjs).
  # Since C1a an open refresh PR no longer stops it: the run carries that PR.
  # Fail-closed: if the lookup
  # errors, this job fails and nothing refreshes, loudly.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Decide whether this run refreshes
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_SCHEDULE: ${{ github.event_name == 'schedule' && github.event.schedule == '17 6 * * 2' }}
        run: |
          set -euo pipefail
          gh run list --repo "$GITHUB_REPOSITORY" --workflow market-refresh-weekly.yml --limit 20 \
            --json databaseId,conclusion,createdAt > "$RUNNER_TEMP/runs.json"
          # Forks are ignored: anyone can open a PR from a branch with this name.
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --head editorial/market-refresh-auto \
            --state open --json url,isCrossRepository \
            --jq '[.[] | select(.isCrossRepository | not)][0].url // empty')
          # C1a: failed runs that stopped at the carry refusal. Retrying them
          # would refuse again (the reasons do not clear by themselves).
          refused=''
          for id in $(jq -r '.[] | select(.conclusion == "failure") | .databaseId' "$RUNNER_TEMP/runs.json" | head -5); do
            if gh run view "$id" --repo "$GITHUB_REPOSITORY" --json jobs \
              --jq '.jobs[].steps[] | select(.name == "Stop on a carry refusal (5.632)" and .conclusion == "failure") | .name' \
              | grep -q .; then
              refused="$refused,$id"
            fi
          done
          OPEN_PR="$open" REFUSED_RUNS="$refused" RUNS_FILE="$RUNNER_TEMP/runs.json" \
            node apps/web/scripts/market-refresh/retry-decision.mjs >> "$GITHUB_OUTPUT"

  refresh:
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 5.135: the SECRET itself is now STEP-scoped (only the ETF-01 leg runs the
    # script that reads it), so it is not exposed to the third-party actions in
    # this job. Only a non-secret BOOLEAN stays job-level, because step-level
    # env is NOT dependable in that same step's own `if` condition — the ETF leg
    # would otherwise skip even when the secret is set — and `secrets` is not an
    # available context in a step-level `if:` at all. Guard semantics unchanged.
    env:
      HAS_POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY != '' }}
      # 5.468: the 14-day staleness backstop BLOCKS here (the refresh is the
      # market's own run); in other lanes' CI it only warns.
      MARKET_STALENESS_ENFORCE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # 5.135: keep the workflow token out of .git/config for later steps.
          # create-pull-request configures its own auth from its `token:` input
          # (it unsets the persisted extraheader and hides checkout's credential
          # files first), so nothing here relies on checkout-persisted creds.
          persist-credentials: false
          # C1a: the carry needs the merge base of main and the open refresh PR.
          fetch-depth: 0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      # C1a (5.632): carry an open refresh PR's data instead of refusing the run.
      # Decides fresh | carry | refuse; on carry it lays the PR's data paths onto
      # main's checkout. It never fails for a refusal: the refusal is acted on
      # after the ETF leg, so that week's collection is kept. Fail-closed only if
      # the PR lookup or git itself fails, before anything is collected.
      - name: Carry an open refresh PR, or refuse (5.632)
        id: carry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head editorial/market-refresh-auto \
            --state open --json number,url,title,headRefOid,isCrossRepository)
          OPEN_PR_JSON="$prs" NOTE_PATH="$RUNNER_TEMP/carry-note.md" \
            node apps/web/scripts/market-refresh/carry-open-pr.mjs prepare >> "$GITHUB_OUTPUT"

      # P4 (2026-10-28): a missing key used to skip the ETF leg silently.
      - name: Say so when the Polygon key is missing (P4)
        if: ${{ env.HAS_POLYGON_API_KEY != 'true' }}
        run: echo "::warning::POLYGON_API_KEY is not set, so no ETF-01 collection runs this week. The core refresh continues; ETF-01 is scored from complete records only."

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build i18n (validators need it)
        run: pnpm --filter @diboas/i18n build

      # Fail-OPEN for the score (the optional leg must not block the core run),
      # but never SILENT (5.465): a missed snapshot becomes next week's ledger
      # gap, so the failure is annotated here and repeated in the PR body.
      # 2026-10-19: an INCOMPLETE pull is refused as ledger data (kept as evidence
      # in etf-snapshot-attempts.jsonl) and also fails this step. While ETF-01 is
      # suspended the message says so: the score is unaffected either way.
      - name: ETF-01 weekly snapshot (optional leg)
        id: etf
        if: ${{ env.HAS_POLYGON_API_KEY == 'true' }}
        # P2 (2026-10-28): a hung provider must not hold the whole job (20 min).
        # A normal collection takes ~2.2 min; 12 leaves room for a degraded
        # provider's retries (two 429s per fund is ~10.5 min). A timeout fails
        # the step; continue-on-error keeps the leg fail-open, and the steps
        # below report it and keep whatever it wrote.
        timeout-minutes: 12
        continue-on-error: true
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: |
          # Never let this lookup abort the step (bash -e): an unreadable state
          # falls back to the neutral wording below, and the step stays fail-open.
          suspended=$(node --input-type=module -e "import { ETF01_SUSPENSION as s } from './apps/web/scripts/market-refresh/lib/etf-suspension.mjs'; console.log(s.active)") || suspended=unknown
          echo "suspended=$suspended" >> "$GITHUB_OUTPUT"
          # 2026-10-19: the exit code says what happened to this week's snapshot
          # (lib/etf-flows.mjs ETF_SNAPSHOT_EXIT): 20 = an incomplete pull was
          # refused (that week can still be collected); 21 = the week already has
          # an incomplete ledger record (preserved, not collected again); 22 = the
          # complete snapshot IS recorded and this step failed after writing it (the
          # step is snapshot-only, so only its closing report runs after the write;
          # the core refresh is the next step).
          rc=0
          node apps/web/scripts/market-refresh/run.mjs --etf-snapshot --no-archive || rc=$?
          case "$rc" in
            0) outcome=ok ;;
            20) outcome=refused ;;
            21) outcome=incomplete-record ;;
            22) outcome=recorded ;;
            *) outcome=error ;;
          esac
          echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
          if [ "$outcome" = 'ok' ] || [ "$outcome" = 'recorded' ]; then
            echo 'status=ok' >> "$GITHUB_OUTPUT"
            if [ "$outcome" = 'recorded' ]; then
              echo "::notice::ETF-01 snapshot recorded for this week. This step failed after writing it (see its log). The record is in the ledger on this runner: it reaches the refresh PR if the run opens one, and is saved as the run artifact otherwise."
            fi
            exit 0
          fi
          echo 'status=failed' >> "$GITHUB_OUTPUT"
          # One note, used verbatim by the annotation and the PR body, so the two
          # cannot disagree. It states only what this run established.
          # The title states only what the outcome establishes: "no complete
          # snapshot recorded" is true for 20 and 21, and NOT established for a
          # generic error (2026-10-19).
          case "$outcome" in
            refused)
              title="ETF-01 collection did not record a complete snapshot this week"
              what="The provider returned incomplete data: the attempt is kept in etf-snapshot-attempts.jsonl and was not added to the ledger. A later complete collection for this week can still be accepted." ;;
            incomplete-record)
              title="ETF-01 collection did not record a complete snapshot this week"
              what="This week already has an incomplete record in the ledger, written before the completeness rule. It is preserved as written, and the current behaviour does not collect this week again." ;;
            *)
              title="ETF-01 collection step ended with an error"
              what="Whether this week's snapshot was recorded is not established by this run (see this step's log)." ;;
          esac
          case "$suspended" in
            true) effect="ETF-01 is suspended, so the score and the other signals are unaffected." ;;
            false) effect="The core refresh and the other signals continue. ETF-01 is scored from complete records only." ;;
            *) effect="The suspension state could not be read in this run. The core refresh and the other signals continue." ;;
          esac
          note="$title. $what $effect"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "note=$note" >> "$GITHUB_OUTPUT"
          echo "::warning::$note"

      # P2: a timed-out or crashed ETF step sets no outputs; say so, neutrally.
      - name: Report an ETF-01 step that did not finish (P2)
        if: ${{ steps.etf.outcome == 'failure' }}
        run: echo "::warning::The ETF-01 collection step did not finish (its 12-minute limit or an unexpected error). Whether this week's snapshot was recorded is not established; the ledger files are kept if the run fails later. The core refresh continues."

      # C1a: a refusal from the carry step stops the run HERE, after the ETF leg,
      # so the artifact step below keeps this week's collection.
      - name: Stop on a carry refusal (5.632)
        if: ${{ steps.carry.outputs.decision == 'refuse' }}
        env:
          REASON: ${{ steps.carry.outputs.reason }}
          REMEDY: ${{ steps.carry.outputs.remedy }}
        run: |
          echo "::error::The weekly refresh refused to run: $REASON."
          echo "::error::This week's ETF-01 collection, if any, is kept as the run artifact. Remedy: $REMEDY"
          exit 1

      - name: Refresh pipeline (fetch → gate → compute → archive)
        run: node apps/web/scripts/market-refresh/run.mjs --append-btc

      # C1c (2026-10-21): a series that cannot be read is reported, not fatal
      # (these series feed the Money Tools only); the note goes in the PR body.
      - name: Tools monthlies (F-M8 leg — idempotent, appends only at month-roll)
        run: node apps/web/scripts/market-refresh/tools-monthlies.mjs --report "$RUNNER_TEMP/tools-note.md"

      - name: Generate editorial copy from templates
        run: node apps/web/scripts/market-refresh/generate.mjs

      - name: Reconcile + jargon gate + market tests (BOT-WRITTEN — blocking)
        run: |
          node apps/web/scripts/market-refresh/generate.mjs --check
          node scripts/check-market-data-jargon.mjs
          # analytics-sdk is included deliberately: the CHART PROVENANCE gate
          # (5.127 — every published history point must reconcile to a real run
          # day) lives in analytics-sdk/__tests__/fixtures.test.ts, not
          # market-data. Without it the bot's pre-flight cannot see the one
          # assertion that stops invented history, and a violation would only
          # surface as red CI on the PR it had already opened. 53 tests, ~0.2s.
          # memoFigureReconciliation is EXCLUDED here by gate class (see header)
          # and runs in the next step + in the PR's own CI.
          pnpm --filter web exec vitest run src/lib/market-data src/lib/analytics-sdk \
            --exclude '**/memoFigureReconciliation.test.ts'

      # HUMAN-OWNED gate: report, never block PR creation (see header).
      - name: Memo figure reconciliation (HUMAN-owned — reported)
        id: memo
        continue-on-error: true
        run: |
          set +e
          out=$(pnpm --filter web exec vitest run \
            src/lib/market-data/__tests__/memoFigureReconciliation.test.ts 2>&1)
          code=$?
          printf '%s\n' "$out"

          if [ "$code" -eq 0 ]; then
            echo 'status=ok' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'status=stale' >> "$GITHUB_OUTPUT"
          # The gate asserts once per locale, so a drifted figure yields one
          # assertion line per affected locale carrying the same orphan list.
          # Collect them ALL and de-duplicate: `head -1` would have shown the
          # founder one locale's worth and hidden the rest.
          # 5.467: the list is extracted by a tested module. The old colon-limited
          # grep stopped inside the first orphan (`detailed: 17.5 | detailed`),
          # showing one figure of ~40 on #629 and #674.
          printf '%s\n' "$out" \
            | node apps/web/scripts/market-refresh/lib/memo-orphans.mjs > "$RUNNER_TEMP/memo-orphans.txt"

          # Exit with the real code so the step renders as FAILED-but-continued.
          # `continue-on-error` is what keeps the job going to open the PR; if
          # this exited 0 the step would look green while the memo was stale,
          # and continue-on-error would be dead configuration that never fires.
          exit "$code"

      # B4(b) 2026-08-11: bot-created PRs (GITHUB_TOKEN) never trigger the main
      # CI, so its format:check does not run on the weekly PR — a formatting
      # violation in pipeline-written files would only surface when a human
      # pushed to the branch (hit 2026-08-11 on the manual data-status edit).
      # Check every file the pipeline writes before opening the PR.
      - name: Format check on pipeline-written files
        run: pnpm exec prettier --check "apps/web/data/market/**/*.json" "apps/web/src/lib/market-data/data/*.json"

      # 2026-10-20: a failed append can leave part of a row in a ledger, and the
      # ETF leg is fail-open, so a run can still reach this point. Reported in
      # the PR title and body, never repaired: the ledgers are append-only
      # (5.302). continue-on-error: if the check itself cannot run, the PR is
      # still opened (a lost week of ETF collection is not known to be reconstructible)
      # and its empty status is treated as NOT ok below.
      - name: Ledger append check (reported)
        id: ledgers
        continue-on-error: true
        run: |
          node apps/web/scripts/market-refresh/check-ledgers.mjs \
            --status "$RUNNER_TEMP/ledger-status" --note "$RUNNER_TEMP/ledger-note.md"
          echo "status=$(cat "$RUNNER_TEMP/ledger-status")" >> "$GITHUB_OUTPUT"

      # Written to RUNNER_TEMP, never the workspace: create-pull-request commits
      # every change in the working tree, so a body file inside the repo would
      # be committed into the refresh PR.
      - name: Compose PR body
        env:
          # The ETF step's own note (2026-10-19), passed as data, never spliced
          # into the script: the PR body repeats exactly what the log says.
          ETF_STATUS: ${{ steps.etf.outputs.status }}
          ETF_TITLE: ${{ steps.etf.outputs.title }}
          ETF_NOTE: ${{ steps.etf.outputs.note }}
          ETF_STEP_OUTCOME: ${{ steps.etf.outcome }}
          LEDGER_STATUS: ${{ steps.ledgers.outputs.status }}
          CARRY_DECISION: ${{ steps.carry.outputs.decision }}
        run: |
          BODY="$RUNNER_TEMP/pr-body.md"
          {
            echo 'Automated weekly /market refresh (P3 pipeline).'
            echo
            echo '- Fetch → fail-closed quality gate → engine → `computed.json`'
            echo '- Editorial copy generated from the reviewed template library'
            echo '- Bot-written gates green: `generate.mjs --check`, jargon, market + analytics-sdk tests, prettier'
          } > "$BODY"
          if [ '${{ steps.memo.outputs.status }}' = 'stale' ]; then
            {
              echo
              echo '## ⚠️ The analyst memo needs a rewrite before this merges'
              echo
              echo 'The memo voice (`summary.short` / `summary.detailed` /'
              echo '`key_supportive_factors` / `key_headwinds`) is **editorial-owned** — the'
              echo 'pipeline never rewrites it. This cycle moved the engine past figures the'
              echo 'memo still quotes, in one or more locales:'
              echo
              echo '```'
              # -s, not just existence: the gate can fail for a reason that
              # produces no orphan lines (e.g. vitest itself erroring), and a
              # bare `cat` on an empty file renders an empty code block with no
              # fallback — a silent blank where the founder needs a pointer.
              if [ -s "$RUNNER_TEMP/memo-orphans.txt" ]; then
                cat "$RUNNER_TEMP/memo-orphans.txt"
              else
                echo '(no orphan list parsed — read the "Memo figure reconciliation" step log)'
              fi
              echo '```'
              echo
              echo 'Update the cycle-dependent clauses **in all four locales** on this branch'
              echo '(runbook: `docs/integrations/market-editorial.md` §7). **CI on this PR is'
              echo 'red until then — that is the 5.128 honesty gate working, not a flake.**'
            } >> "$BODY"
          else
            {
              echo '- Memo figure reconciliation: green (memo agrees with this cycle'"'"'s engine values)'
            } >> "$BODY"
          fi
          if [ "$LEDGER_STATUS" = 'ok' ]; then
            echo '- Ledger append check: only complete rows were appended to the JSONL ledgers' >> "$BODY"
          else
            {
              echo
              echo '## ⚠️ Ledger check did not pass: do not merge as is'
              echo
              if [ -s "$RUNNER_TEMP/ledger-note.md" ]; then
                cat "$RUNNER_TEMP/ledger-note.md"
              else
                echo 'The check did not run to completion, so the ledgers are unverified (read the "Ledger append check" step log).'
              fi
            } >> "$BODY"
          fi
          if [ -s "$RUNNER_TEMP/tools-note.md" ]; then
            {
              echo
              echo '## Money Tools monthly prices behind'
              echo
              cat "$RUNNER_TEMP/tools-note.md"
            } >> "$BODY"
          fi
          if [ "$CARRY_DECISION" = 'carry' ] && [ -s "$RUNNER_TEMP/carry-note.md" ]; then
            {
              echo
              cat "$RUNNER_TEMP/carry-note.md"
            } >> "$BODY"
          fi
          # The ETF step is skipped exactly when the key is missing (its only `if`).
          if [ "$ETF_STEP_OUTCOME" = 'skipped' ]; then
            {
              echo
              echo '## ETF-01 collection did not run'
              echo
              echo 'POLYGON_API_KEY is not set, so no ETF-01 collection ran this week. ETF-01 is scored from complete records only.'
            } >> "$BODY"
          elif [ "$ETF_STEP_OUTCOME" = 'failure' ] && [ -z "$ETF_STATUS" ]; then
            {
              echo
              echo '## ETF-01 collection step did not finish'
              echo
              echo "It stopped at its 12-minute limit or on an unexpected error (see the step log). Whether this week's snapshot was recorded is not established by this run."
            } >> "$BODY"
          fi
          if [ "$ETF_STATUS" = 'failed' ]; then
            {
              echo
              echo "## $ETF_TITLE"
              echo
              echo "$ETF_NOTE"
            } >> "$BODY"
          fi
          {
            echo
            echo '**Review the plain-language summary and per-signal copy before merging.**'
            echo 'If a cycle needs a human override, add it to'
            echo '`apps/web/data/market/shared/editorial-override.json` **with a `_cycle` key'
            echo 'stamping this cycle'"'"'s date (computed.json `computed_at`, YYYY-MM-DD)** and'
            echo 're-run `generate.mjs` — overrides are cycle-scoped and an unstamped or stale'
            echo 'file is ignored with a warning. The 14-day staleness gate is the backstop.'
          } >> "$BODY"

      # C1a (5.632): publish only if the refresh branch is exactly where the
      # carry step found it. A memo pushed mid-run, or the PR merged or closed,
      # would otherwise be overwritten or misreported. Immediately before the
      # publish step, and fail-closed.
      - name: Re-check the refresh PR before publishing (5.632)
        env:
          GH_TOKEN: ${{ github.token }}
          DECISION: ${{ steps.carry.outputs.decision }}
          START_HEAD: ${{ steps.carry.outputs.start_head }}
          PR_NUMBER: ${{ steps.carry.outputs.pr_number }}
        run: |
          set -euo pipefail
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --head editorial/market-refresh-auto \
            --state open --json number,url,title,headRefOid,isCrossRepository)
          OPEN_PR_JSON="$prs" node apps/web/scripts/market-refresh/carry-open-pr.mjs verify

      - name: Open refresh PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          # B4(a) 2026-08-11: a PR created with the default GITHUB_TOKEN never
          # triggers `pull_request` workflows, so the weekly PR got no main CI.
          # The fine-grained PAT (Contents + Pull requests on this repo only,
          # founder-owned) makes the full battery run on it. If the secret is
          # REMOVED the || falls back to the default token (old no-CI behavior,
          # still guarded by the in-workflow gates). An EXPIRED token does NOT
          # fall back — the secret is still non-empty — the PR step fails
          # loudly instead (workflow-failure email): renew the PAT.
          token: ${{ secrets.MARKET_REFRESH_PR_TOKEN || github.token }}
          branch: editorial/market-refresh-auto
          # C1a: always into main, whatever ref started the run (the carry step
          # also refuses a run that did not start from main).
          base: main
          commit-message: 'data(market): weekly refresh (automated)'
          # The ledger check outranks the memo: an empty status (the check did
          # not run) is treated as not ok.
          # C1a: a carried PR's memo describes the earlier week, so a carry is
          # flagged like a stale memo even when no quoted figure drifted.
          title: >-
            ${{ steps.ledgers.outputs.status != 'ok'
            && 'data(market): weekly refresh — LEDGER CHECK FAILED, do not merge as is'
            || steps.memo.outputs.status == 'stale'
            && 'data(market): weekly refresh — MEMO REWRITE REQUIRED before merge'
            || steps.carry.outputs.decision == 'carry'
            && 'data(market): weekly refresh — MEMO REWRITE REQUIRED before merge'
            || 'data(market): weekly refresh — review before merge' }}
          body-path: ${{ runner.temp }}/pr-body.md
          labels: >-
            ${{ steps.memo.outputs.status == 'stale'
            && 'market-refresh,needs-editorial-review,memo-rewrite-required'
            || steps.carry.outputs.decision == 'carry'
            && 'market-refresh,needs-editorial-review,memo-rewrite-required'
            || 'market-refresh,needs-editorial-review' }}

      # 2026-10-21 (review gate): every step after the ETF leg runs only on
      # success, so a later failure (STALE INPUT, a source outage, a gate)
      # stopped the job before the PR and the runner, with this week's ETF
      # record on it, was discarded. Keep the ETF files whenever the run fails
      # after the leg wrote something, or may have written part of something
      # ('error': a failed append exits 1). Recovery is a manual, reviewed append.
      - name: Keep the ETF ledger files when the run fails after the ETF leg
        if: ${{ failure() && (steps.etf.outputs.outcome == 'ok' || steps.etf.outputs.outcome == 'recorded' || steps.etf.outputs.outcome == 'refused' || steps.etf.outputs.outcome == 'error' || steps.etf.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: etf-ledger-${{ github.run_id }}
          path: |
            apps/web/data/market/shared/etf-shares-weekly.jsonl
            apps/web/data/market/shared/etf-snapshot-attempts.jsonl
          if-no-files-found: warn
          retention-days: 90
