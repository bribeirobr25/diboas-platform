# Weekly /market refresh — automated PR (P3, founder ruling 2026-07-11: Mondays 06:00 UTC).
#
# The pipeline NEVER pushes to main. It opens a PR with the compute log in the
# body; CODEOWNERS reviews the editorial copy and merges. The 14-day staleness
# gate remains the backstop of last resort. Merge stays human until trust is
# earned (plan §B Stage 4).
#
# Flow: fetch (dual-source verified) → quality gate (fail-closed) → engine →
# computed.json → generate editorial JSONs from templates → reconcile → PR.
#
# GATE CLASSES (2026-08-31, PENDING_ALL 5.151 — do not re-merge these two):
#   * BOT-WRITTEN output (generate.mjs --check, jargon, market/analytics-sdk
#     tests, prettier) gates BEFORE the PR. The bot can always satisfy these by
#     regenerating, so blocking is correct and keeps bad data out of a PR.
#   * HUMAN-OWNED fields (the research-memo voice: summary.{short,detailed},
#     key_supportive_factors, key_headwinds — generate.mjs never writes them)
#     are REPORTED here and gate on the PR's own CI instead. A bot pre-flight
#     can never satisfy a human-owned invariant: on 2026-08-31 the memo gate
#     sat in the pre-flight, so a drifted figure killed the job and NO PR was
#     opened — which also broke the ratified AUTO-HOLD policy (it assumes a PR
#     exists to hold) and made the miss invisible except a failure email.
#     The honesty guarantee is unchanged: a stale memo still cannot MERGE,
#     because memoFigureReconciliation runs in the PR's full CI battery.
#
# Requires repo secret POLYGON_API_KEY (founder-owned) for the ETF-01 leg.
# Without it the ETF snapshot step is skipped and ETF-01 stays UNAVAILABLE —
# the run still succeeds (fail-open on the optional leg, fail-closed on core).

name: Market Refresh (weekly)

on:
  schedule:
    # 5.151: :17 past, not :00. GitHub drops scheduled runs under load at popular
    # cron minutes; every past run was already 1-2h late and 2026-08-31 never
    # fired at all. The watchdog (market-refresh-watchdog.yml) catches a miss.
    - cron: '17 6 * * 1' # Mondays 06:17 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 5.135: the SECRET itself is now STEP-scoped (only the ETF-01 leg runs the
    # script that reads it), so it is not exposed to the third-party actions in
    # this job. Only a non-secret BOOLEAN stays job-level, because step-level
    # env is NOT dependable in that same step's own `if` condition — the ETF leg
    # would otherwise skip even when the secret is set — and `secrets` is not an
    # available context in a step-level `if:` at all. Guard semantics unchanged.
    env:
      HAS_POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          # 5.135: keep the workflow token out of .git/config for later steps.
          # create-pull-request configures its own auth from its `token:` input
          # (it unsets the persisted extraheader and hides checkout's credential
          # files first), so nothing here relies on checkout-persisted creds.
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Build i18n (validators need it)
        run: pnpm --filter @diboas/i18n build

      - name: ETF-01 weekly snapshot (optional leg)
        if: ${{ env.HAS_POLYGON_API_KEY == 'true' }}
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
        run: node apps/web/scripts/market-refresh/run.mjs --etf-snapshot --no-archive || true

      - name: Refresh pipeline (fetch → gate → compute → archive)
        run: node apps/web/scripts/market-refresh/run.mjs --append-btc

      - name: Tools monthlies (F-M8 leg — idempotent, appends only at month-roll)
        run: node apps/web/scripts/market-refresh/tools-monthlies.mjs

      - name: Generate editorial copy from templates
        run: node apps/web/scripts/market-refresh/generate.mjs

      - name: Reconcile + jargon gate + market tests (BOT-WRITTEN — blocking)
        run: |
          node apps/web/scripts/market-refresh/generate.mjs --check
          node scripts/check-market-data-jargon.mjs
          # analytics-sdk is included deliberately: the CHART PROVENANCE gate
          # (5.127 — every published history point must reconcile to a real run
          # day) lives in analytics-sdk/__tests__/fixtures.test.ts, not
          # market-data. Without it the bot's pre-flight cannot see the one
          # assertion that stops invented history, and a violation would only
          # surface as red CI on the PR it had already opened. 53 tests, ~0.2s.
          # memoFigureReconciliation is EXCLUDED here by gate class (see header)
          # and runs in the next step + in the PR's own CI.
          pnpm --filter web exec vitest run src/lib/market-data src/lib/analytics-sdk \
            --exclude '**/memoFigureReconciliation.test.ts'

      # HUMAN-OWNED gate: report, never block PR creation (see header).
      - name: Memo figure reconciliation (HUMAN-owned — reported)
        id: memo
        continue-on-error: true
        run: |
          set +e
          out=$(pnpm --filter web exec vitest run \
            src/lib/market-data/__tests__/memoFigureReconciliation.test.ts 2>&1)
          code=$?
          printf '%s\n' "$out"
          if [ "$code" -eq 0 ]; then
            echo 'status=ok' >> "$GITHUB_OUTPUT"
          else
            echo 'status=stale' >> "$GITHUB_OUTPUT"
            # One line per orphaned figure, deduped, for the PR body.
            printf '%s\n' "$out" \
              | grep -oE 'figures with no engine value behind them[^:]*: [^:]*' \
              | head -1 > "$RUNNER_TEMP/memo-orphans.txt" || true
          fi

      # B4(b) 2026-08-11: bot-created PRs (GITHUB_TOKEN) never trigger the main
      # CI, so its format:check does not run on the weekly PR — a formatting
      # violation in pipeline-written files would only surface when a human
      # pushed to the branch (hit 2026-08-11 on the manual data-status edit).
      # Check every file the pipeline writes before opening the PR.
      - name: Format check on pipeline-written files
        run: pnpm exec prettier --check "apps/web/data/market/**/*.json" "apps/web/src/lib/market-data/data/*.json"

      # Written to RUNNER_TEMP, never the workspace: create-pull-request commits
      # every change in the working tree, so a body file inside the repo would
      # be committed into the refresh PR.
      - name: Compose PR body
        run: |
          BODY="$RUNNER_TEMP/pr-body.md"
          {
            echo 'Automated weekly /market refresh (P3 pipeline).'
            echo
            echo '- Fetch → fail-closed quality gate → engine → `computed.json`'
            echo '- Editorial copy generated from the reviewed template library'
            echo '- Bot-written gates green: `generate.mjs --check`, jargon, market + analytics-sdk tests, prettier'
          } > "$BODY"
          if [ '${{ steps.memo.outputs.status }}' = 'stale' ]; then
            {
              echo
              echo '## ⚠️ The analyst memo needs a rewrite before this merges'
              echo
              echo 'The memo voice (`summary.short` / `summary.detailed` /'
              echo '`key_supportive_factors` / `key_headwinds`) is **editorial-owned** — the'
              echo 'pipeline never rewrites it. This cycle moved the engine past figures the'
              echo 'memo still quotes, in one or more locales:'
              echo
              echo '```'
              cat "$RUNNER_TEMP/memo-orphans.txt" 2>/dev/null || echo '(see the "Memo figure reconciliation" step log)'
              echo '```'
              echo
              echo 'Update the cycle-dependent clauses **in all four locales** on this branch'
              echo '(runbook: `docs/integrations/market-editorial.md` §7). **CI on this PR is'
              echo 'red until then — that is the 5.128 honesty gate working, not a flake.**'
            } >> "$BODY"
          else
            {
              echo '- Memo figure reconciliation: green (memo agrees with this cycle'"'"'s engine values)'
            } >> "$BODY"
          fi
          {
            echo
            echo '**Review the plain-language summary and per-signal copy before merging.**'
            echo 'If a cycle needs a human override, add it to'
            echo '`apps/web/data/market/shared/editorial-override.json` **with a `_cycle` key'
            echo 'stamping this cycle'"'"'s date (computed.json `computed_at`, YYYY-MM-DD)** and'
            echo 're-run `generate.mjs` — overrides are cycle-scoped and an unstamped or stale'
            echo 'file is ignored with a warning. The 14-day staleness gate is the backstop.'
          } >> "$BODY"

      - name: Open refresh PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.11
        with:
          # B4(a) 2026-08-11: a PR created with the default GITHUB_TOKEN never
          # triggers `pull_request` workflows, so the weekly PR got no main CI.
          # The fine-grained PAT (Contents + Pull requests on this repo only,
          # founder-owned) makes the full battery run on it. If the secret is
          # REMOVED the || falls back to the default token (old no-CI behavior,
          # still guarded by the in-workflow gates). An EXPIRED token does NOT
          # fall back — the secret is still non-empty — the PR step fails
          # loudly instead (workflow-failure email): renew the PAT.
          token: ${{ secrets.MARKET_REFRESH_PR_TOKEN || github.token }}
          branch: editorial/market-refresh-auto
          commit-message: 'data(market): weekly refresh (automated)'
          title: >-
            ${{ steps.memo.outputs.status == 'stale'
            && 'data(market): weekly refresh — MEMO REWRITE REQUIRED before merge'
            || 'data(market): weekly refresh — review before merge' }}
          body-path: ${{ runner.temp }}/pr-body.md
          labels: >-
            ${{ steps.memo.outputs.status == 'stale'
            && 'market-refresh,needs-editorial-review,memo-rewrite-required'
            || 'market-refresh,needs-editorial-review' }}
